version: 0.2

phases:
  install:
    runtime-version:
       nodejs: 22
    commands:
      - echo Installing source NPM dependencies...
      - npm install
  build:
    commands:
      - echo Build started on 'date'
      - echo Building the Node.js application...
      - npm run build
  post_build:
    commands:
      - echo Build completed on `date`
      - mkdir deploy
      - cp -r dist deploy/dist
      - mv appspec.yaml appspec.yml 
      - cp appspec.yml deploy/
      - cp -r Scripts deploy/
      - chmod +x deploy/Scripts/restartNginx.sh
      - chmod +x deploy/Scripts/appStop.sh 


artifacts:
  files:
   - '**/*'
  base-directory: deploy
  name: frontend-build 